[platformio]
default_envs = develop_RP2040
extra_configs =
  lib/OGM-Common/platformio.esp32.ini
  lib/OGM-Common/platformio.base.ini
  lib/OGM-Common/platformio.rp2040.ini

[env:release_DEVICE_REG1_BASE]
extends = RP2040_releases
build_flags =
  ${KNX_TP.build_flags}
  ${RP2040_releases.build_flags}
  -D DEVICE_REG1_BASE

[env:release_PresenceMultiSensor_ABSmartHouse]
extends = RP2040_releases
build_flags =
  ${KNX_TP.build_flags}
  ${RP2040_releases.build_flags}
  -D BOARD_AB_PRE

[env:develop_RP2040]
extends = RP2040_develop
build_flags =
  ${KNX_TP.build_flags}
  ${RP2040_develop.build_flags}

[env:release_DEVICE_REG1_LAN_TP_BASE]
extends = ESP32_releases
build_flags =
  ${KNX_TP.build_flags}
  ${ESP32_releases.build_flags}
  -D DEVICE_REG1_LAN_TP_BASE

[env:release_DEVICE_REG2_PIPICO_V1_DD]
extends = env:release_DEVICE_REG1_BASE
build_flags =
  ${env:release_DEVICE_REG1_BASE.build_flags}
  -U DEVICE_REG1_BASE
  -D DEVICE_REG2_PIPICO_V1_DD
